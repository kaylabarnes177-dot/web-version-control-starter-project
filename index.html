<!doctype html>
<html lang="en">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <!--Introduction-->
  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Here is where your div container(s) will go with your web page content-->
    <div class="container lg bg-dark text-white">
      <h1>Hello, GitHub! I'm Kayla.</h1>

      <p>
        This is my first web page using version control with Git and GitHub.
      </p>

      <p>
        I am learning to edit and version websites using VS Code, Git, and
        GitHub.
      </p>
      <!--Adds list-->
      <ul>
        <li>Books</li>
        <li>Understanding</li>
        <li>Coding</li>
      </ul>
    </div>
    <script>
      // Load only the #site-nav element
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
